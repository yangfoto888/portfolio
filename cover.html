<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yang Photo Studio | Commercial Photographer Portfolio</title>
<meta name="description" content="Yang Photo Studio — commercial photographer specializing in Commercial and Portrait photography, with Scene and Street work.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!--
  Gotham is a commercial typeface (Hoefler&Co / Monotype) and isn't available on a free CDN.
  If you have a license (e.g. an Adobe Fonts / Typekit project, or purchased webfont files),
  add your @font-face rule or Adobe Fonts <link>/kit script here — the CSS below already
  lists "Gotham" first in every font stack, so it will be picked up automatically once available.
  Until then, the page falls back to Inter / system sans-serif.
-->
<style>
  :root{
    --bg:#0b0b0d;
    --text:#f3f1ec;
    --text-dim:#a5a19a;
    --line:#2a2a2d;
    --accent:#5C728A;
    --accent-dim:#455A70;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Gotham', 'Inter', 'Helvetica Neue', Arial, sans-serif;
    font-weight:300;
    line-height:1.7;
    overflow:hidden;
  }
  a{color:inherit;text-decoration:none;}

  .lang-toggle{
    position:fixed;top:26px;right:28px;z-index:10;
    border:1px solid var(--line);background:transparent;color:var(--text-dim);
    font-family:inherit;font-size:.78rem;letter-spacing:.05em;padding:8px 16px;
    border-radius:20px;cursor:pointer;transition:.25s;
  }
  .lang-toggle:hover{border-color:var(--accent);color:var(--text);}

  .cover{
    position:fixed;inset:0;
    background:
      linear-gradient(180deg, rgba(11,11,13,.45), rgba(11,11,13,.94) 80%),
      url('https://picsum.photos/seed/yang-cover/1800/1400') center/cover no-repeat;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px;
  }
  .cover-welcome{
    color:var(--accent);font-size:.78rem;letter-spacing:.4em;text-transform:uppercase;
    font-weight:500;margin-bottom:22px;
  }
  .cover-logo{
    font-family:'Gotham', 'Inter', 'Helvetica Neue', Arial, sans-serif;font-weight:600;
    font-size:clamp(1.8rem,5vw,3.2rem);letter-spacing:.1em;margin-bottom:20px;
  }
  .cover-tagline{color:var(--text-dim);max-width:440px;margin-bottom:56px;font-size:1rem;}
  .cover-cta{
    display:inline-flex;align-items:center;gap:12px;cursor:pointer;
    background:var(--accent);border:none;color:#f3f1ec;font-family:inherit;
    font-size:.82rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
    padding:16px 34px;border-radius:999px;transition:.3s;
  }
  .cover-cta:hover{background:var(--accent-dim);}
  .cover-social{position:absolute;bottom:36px;display:flex;gap:18px;}
  .cover-social a{
    color:var(--text-dim);font-size:.72rem;letter-spacing:.05em;border:1px solid var(--line);
    border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;
    transition:.25s;
  }
  .cover-social a:hover{border-color:var(--accent);color:var(--accent);}
</style>
</head>
<body>

<button class="lang-toggle" id="langToggle" data-current="en">中文</button>

<div class="cover">
  <span class="cover-welcome" data-i18n="cover.welcome">Welcome</span>
  <div class="cover-logo">YANG PHOTO STUDIO</div>
  <p class="cover-tagline" data-i18n="cover.tagline">Commercial &amp; Portrait Photography — Taiwan</p>
  <a class="cover-cta" id="coverEnter" href="index.html">
    <span data-i18n="cover.cta">Tap to see more</span>
  </a>
  <div class="cover-social">
    <a href="https://www.instagram.com/uhitskk" target="_blank" rel="noopener" title="Instagram">IG</a>
    <a href="https://www.behance.net/yangphotostudio" target="_blank" rel="noopener" title="Behance">BE</a>
    <a href="mailto:yangfoto888@gmail.com" title="Email">@</a>
  </div>
</div>

<script>
  const translations = {
    en: {
      'meta.title': 'Yang Photo Studio | Commercial Photographer Portfolio',
      'meta.desc': 'Yang Photo Studio — commercial photographer specializing in Commercial and Portrait photography, with Scene and Street work.',
      'cover.welcome': 'Welcome',
      'cover.tagline': 'Commercial & Portrait Photography — Taiwan',
      'cover.cta': 'Tap to see more'
    },
    zh: {
      'meta.title': 'Yang Photo Studio | 商業攝影師作品集',
      'meta.desc': 'Yang Photo Studio — 商業攝影師，主力提供商業與人像攝影，並持續進行場景與街拍創作。',
      'cover.welcome': '歡迎光臨',
      'cover.tagline': '商業與人像攝影 — 台灣',
      'cover.cta': '點擊查看更多'
    }
  };

  const langToggle = document.getElementById('langToggle');
  const coverEnter = document.getElementById('coverEnter');
  const metaDesc = document.querySelector('meta[name="description"]');

  function applyLanguage(lang){
    const dict = translations[lang];
    document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
    document.title = dict['meta.title'];
    if(metaDesc) metaDesc.setAttribute('content', dict['meta.desc']);
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const val = dict[el.dataset.i18n];
      if(val !== undefined) el.textContent = val;
    });
    langToggle.textContent = lang === 'en' ? '中文' : 'EN';
    langToggle.dataset.current = lang;
    // carry the language choice through to the main site
    coverEnter.href = 'index.html?lang=' + lang;
  }

  langToggle.addEventListener('click', () => {
    applyLanguage(langToggle.dataset.current === 'en' ? 'zh' : 'en');
  });

  applyLanguage('en');
</script>

</body>
</html>
